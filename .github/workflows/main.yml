name: Build ChromiumClient

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Chromium source
        shell: bash
        run: |
          echo "Checking project structure..."

          test -f build.gradle
          test -f gradle.properties
          test -f settings.gradle
          test -f src/main/java/dev/chromiumclient/ChromiumClient.java
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/chromiumclient.mixins.json

          COUNT=$(find src/main/java -type f -name "*.java" | wc -l)
          echo "Found $COUNT Java files"

          if [ "$COUNT" -lt 10 ]; then
            echo "ERROR: ChromiumClient source files are missing!"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1

      - name: Build ChromiumClient
        run: gradle build

      - name: Inspect JAR
        shell: bash
        run: |
          echo "Built files:"
          ls -lh build/libs/

          JAR=$(find build/libs -name "ChromiumClient-*.jar" ! -name "*sources*" | head -1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No normal ChromiumClient JAR found."
            exit 1
          fi

          echo "Checking $JAR"

          unzip -l "$JAR" | grep "fabric.mod.json"
          unzip -l "$JAR" | grep "ChromiumClient.class"

          SIZE=$(stat -c%s "$JAR")
          echo "JAR size: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: JAR is suspiciously small."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChromiumClient
          path: build/libs/*.jar
